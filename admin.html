<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Aditya's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="login-logo">
          <span class="logo-bracket">&lt;</span>AS<span class="logo-bracket"
            >/&gt;</span
          >
        </div>
        <h1 class="login-title">Admin Panel</h1>
        <p class="login-sub">Enter your password to continue</p>
        <div class="field-group">
          <input
            type="password"
            id="passwordInput"
            class="admin-input"
            placeholder="Password"
            autocomplete="current-password"
          />
          <button id="loginBtn" class="btn-login">Enter</button>
        </div>
        <p id="loginError" class="login-error"></p>
      </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDash" class="admin-dash hidden">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <span class="logo-bracket">&lt;</span>AS<span class="logo-bracket"
            >/&gt;</span
          >
          <span class="sidebar-label">Admin</span>
        </div>
        <nav class="sidebar-nav">
          <button class="sidebar-btn active" data-panel="projects">
            📁 Projects
          </button>
          <button class="sidebar-btn" data-panel="skills">⚡ Skills</button>
          <button class="sidebar-btn" data-panel="profile">👤 Profile</button>
        </nav>
        <div class="sidebar-footer">
          <a href="index.html" target="_blank" class="view-site">↗ View Site</a>
          <button id="logoutBtn" class="btn-logout">Log Out</button>
        </div>
      </aside>

      <main class="admin-main">
        <!-- ── PROJECTS PANEL ── -->
        <div id="panel-projects" class="panel active">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">Projects</h2>
              <p class="panel-sub">Manage your portfolio projects</p>
            </div>
            <button id="addProjectBtn" class="btn-add">+ Add Project</button>
          </div>

          <!-- Add / Edit Form -->
          <div id="projectForm" class="form-card hidden">
            <h3 class="form-title" id="projectFormTitle">New Project</h3>
            <div class="form-grid">
              <div class="field-group full">
                <label>Title</label>
                <input
                  type="text"
                  id="pTitle"
                  class="admin-input"
                  placeholder="Project title"
                />
              </div>
              <div class="field-group full">
                <label>Description</label>
                <textarea
                  id="pDesc"
                  class="admin-textarea"
                  rows="3"
                  placeholder="Short description…"
                ></textarea>
              </div>
              <div class="field-group">
                <label>URL</label>
                <input
                  type="url"
                  id="pUrl"
                  class="admin-input"
                  placeholder="https://…"
                />
              </div>
              <div class="field-group">
                <label>Category</label>
                <select id="pCat" class="admin-select">
                  <option value="web">Web</option>
                  <option value="data">Data</option>
                  <option value="db">Database</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="field-group full">
                <label
                  >Tags <span class="field-hint">(comma separated)</span></label
                >
                <input
                  type="text"
                  id="pTags"
                  class="admin-input"
                  placeholder="HTML, CSS, JavaScript"
                />
              </div>
              <div class="field-group">
                <label class="checkbox-label">
                  <input type="checkbox" id="pFeatured" />
                  Mark as Featured
                </label>
              </div>
            </div>
            <div class="form-actions">
              <button id="saveProjectBtn" class="btn-save">Save Project</button>
              <button id="cancelProjectBtn" class="btn-cancel">Cancel</button>
            </div>
            <input type="hidden" id="editProjectId" value="" />
          </div>

          <!-- Projects Table -->
          <div class="table-wrap">
            <table class="admin-table" id="projectsTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Featured</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="projectsBody"></tbody>
            </table>
          </div>
        </div>

        <!-- ── SKILLS PANEL ── -->
        <div id="panel-skills" class="panel">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">Skills</h2>
              <p class="panel-sub">Manage your skill groups</p>
            </div>
            <button id="addSkillGroupBtn" class="btn-add">+ Add Group</button>
          </div>

          <div id="skillForm" class="form-card hidden">
            <h3 class="form-title" id="skillFormTitle">New Skill Group</h3>
            <div class="form-grid">
              <div class="field-group">
                <label>Category Name</label>
                <input
                  type="text"
                  id="sCat"
                  class="admin-input"
                  placeholder="e.g. Frameworks"
                />
              </div>
              <div class="field-group">
                <label>Icon / Emoji</label>
                <input
                  type="text"
                  id="sIcon"
                  class="admin-input"
                  placeholder="⚡"
                  maxlength="4"
                />
              </div>
              <div class="field-group full">
                <label
                  >Skills
                  <span class="field-hint">(comma separated)</span></label
                >
                <input
                  type="text"
                  id="sItems"
                  class="admin-input"
                  placeholder="React, Vue, Node.js"
                />
              </div>
            </div>
            <div class="form-actions">
              <button id="saveSkillBtn" class="btn-save">Save Group</button>
              <button id="cancelSkillBtn" class="btn-cancel">Cancel</button>
            </div>
            <input type="hidden" id="editSkillIdx" value="" />
          </div>

          <div class="skills-admin-grid" id="skillsAdminGrid"></div>
        </div>

        <!-- ── PROFILE PANEL ── -->
        <div id="panel-profile" class="panel">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">Profile</h2>
              <p class="panel-sub">Update your hero section text</p>
            </div>
          </div>
          <div class="form-card" style="display: block">
            <div class="form-grid">
              <div class="field-group full">
                <label>Bio / Intro paragraph</label>
                <textarea
                  id="profileBio"
                  class="admin-textarea"
                  rows="5"
                ></textarea>
              </div>
              <div class="field-group full">
                <label
                  >Typed phrases
                  <span class="field-hint">(one per line)</span></label
                >
                <textarea
                  id="profilePhrases"
                  class="admin-textarea"
                  rows="5"
                ></textarea>
              </div>
            </div>
            <div class="form-actions">
              <button id="saveProfileBtn" class="btn-save">Save Profile</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="data.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
